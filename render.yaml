services:
  - type: web
    name: cafeia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/mobilenet_finetuned_epoch6.pt
      - key: MODEL_SHA256
        value: 4ab4e52fc3d417fe5fb126ff1e5b346f080c55ffa80232cffd5d6e6622e46c94
      - key: MODEL_ID
        value: mobilenet-v3-small-finetuned-epoch6
      - key: CORS_ALLOWED_ORIGINS
        sync: false
