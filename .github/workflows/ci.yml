name: Verificación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend y checkpoint real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-test.txt
      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements-api.txt -r requirements-test.txt
      - name: Ejecutar pruebas del backend
        run: python -m pytest -q tests/backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Probar flujo de solicitudes
        run: npm run test:request-flow
      - name: Compilar frontend
        run: npm run build
